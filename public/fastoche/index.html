<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fastoche! — Le quiz culture G entre amis</title>
  <meta name="description" content="Application iOS de quiz culturels. 20 000+ questions, 240+ thèmes, 3 modes de jeu.">
  <meta name="color-scheme" content="light">
  <meta property="og:title" content="Fastoche!">
  <meta property="og:description" content="Le quiz culture G entre amis (ou en solo).">
  <meta property="og:image" content="https://theosury.fr/fastoche/icon.png">
  <link rel="icon" type="image/png" href="/fastoche/icon.png">
  <link rel="apple-touch-icon" href="/fastoche/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Syne+Mono&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }

    :root {
      color-scheme: light;
      --bg: #e8cdbc;
      --bg-deep: #d4b8a4;
      --ink: #1a1410;
      --muted: #7a7068;
      --accent: #c8451a;
      --orange: #e8501a;
      --orange-shadow: #a03510;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top bar */
    .topbar {
      flex-shrink: 0;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(16px, 2.5vw, 28px) clamp(20px, 4vw, 40px);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar img {
      width: clamp(32px, 4vw, 40px);
      height: clamp(32px, 4vw, 40px);
      border-radius: 9px;
    }
    .topbar .name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(16px, 2vw, 20px);
      color: var(--orange);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .topbar .beta {
      margin-left: auto;
      font-family: 'Syne Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 10px;
      border: 1px solid var(--bg-deep);
      border-radius: 999px;
    }

    /* Main hero */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(8px, 2vw, 24px) clamp(20px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(16px, 2.5vw, 28px);
    }

    .poster-tag {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(40px, 9vw, 112px);
      line-height: 0.92;
      letter-spacing: -2.5px;
      color: var(--ink);
      margin: 0;
      text-transform: uppercase;
    }
    .poster-tag .line {
      display: block;
      white-space: nowrap;
    }
    .poster-tag .accent { color: var(--orange); }
    .poster-tag .period { color: var(--orange); }

    .kicker {
      margin: 0;
      font-family: 'Syne Mono', monospace;
      font-size: clamp(12px, 1.5vw, 16px);
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      transform: rotate(-2deg);
      transform-origin: left center;
      display: inline-block;
      align-self: flex-start;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 24px;
    }
    .meta {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(15px, 1.7vw, 19px);
      color: var(--ink);
      letter-spacing: -0.3px;
      line-height: 1.3;
      margin: 0;
    }
    .meta .num { color: var(--orange); }

    .cta-soon {
      display: inline-flex;
      align-items: center;
      padding: 14px 24px;
      border-radius: 14px;
      background: var(--orange);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 5px 0 var(--orange-shadow);
      text-decoration: none;
      align-self: flex-start;
    }

    /* Footer — infos importantes */
    footer {
      flex-shrink: 0;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(14px, 2vw, 22px) clamp(20px, 4vw, 40px);
      border-top: 1px solid var(--bg-deep);
      font-family: 'Syne Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px 24px;
      flex-wrap: wrap;
    }
    footer .cats {
      flex: 1;
      min-width: 0;
    }
    footer .cats .label {
      color: var(--ink);
      margin-right: 8px;
    }
    footer .links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    footer a {
      color: var(--muted);
      text-decoration: none;
    }
    footer a:hover { color: var(--orange); }
    footer .sep { color: var(--bg-deep); margin: 0 4px; }

    @media (max-width: 720px) {
      footer {
        flex-direction: column;
        align-items: flex-start;
      }
      .poster-tag { letter-spacing: -1.5px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <img src="/fastoche/icon.png" alt="">
    <span class="name">Fastoche!</span>
    <span class="beta">Beta</span>
  </header>

  <main>
    <h1 class="poster-tag">
      <span class="line">Le quiz</span>
      <span class="line accent">culture&nbsp;G</span>
      <span class="line">entre amis<span class="period">.</span></span>
    </h1>

    <p class="kicker">(ou en solo, sans pression.)</p>

    <p class="meta">
      <span class="num">20 000+</span> questions, <span class="num">240+</span> thèmes,
      <span class="num">3</span> modes de jeu. iOS uniquement.
    </p>

    <a class="cta-soon" href="#">Bientôt sur l'App Store</a>
  </main>

  <footer>
    <div class="cats">
      <span class="label">Catégories</span>
      Histoire<span class="sep">/</span>Sciences &amp; Nature<span class="sep">/</span>Géographie<span class="sep">/</span>Arts &amp; Lettres<span class="sep">/</span>Divertissement<span class="sep">/</span>Sport &amp; Loisirs
    </div>
    <div class="links">
      <a href="mailto:contact@theosury.fr">Contact</a>
      <a href="/fastoche/privacy">Confidentialité</a>
      <span>© 2026</span>
    </div>
  </footer>

</body>
</html>
